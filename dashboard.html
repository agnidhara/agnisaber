<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #1f4037, #99f2c8);
      font-family: Arial;
    }

    .card {
      width: 420px;
      padding: 25px;
      background: rgba(0,0,0,0.6);
      color: white;
      border-radius: 20px;
      text-align: center;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #4CAF50;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .play { background: #4CAF50; color: white; }
    .logout { background: #ff5722; color: white; }
  </style>
</head>
<body>

<div class="card">
  <h2>Welcome, Player 👋</h2>

  <img id="profilePic" src="" alt="Profile Picture">

  <input type="file" accept="image/*" onchange="savePic(event)">

  <button class="play" onclick="goGame()">▶ Play Guess the Number</button>
  <p>✨ More coming soon...</p>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
  const img = document.getElementById("profilePic");

  // Load saved image
  const savedPic = localStorage.getItem("profilePic");
  if (savedPic) {
    img.src = savedPic;
  } else {
    img.src = "https://via.placeholder.com/120";
  }

  function savePic(event) {
    const file = event.target.files[0];
    const reader = new FileReader();

    reader.onload = function () {
      localStorage.setItem("profilePic", reader.result);
      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  }

  function goGame() {
    window.location.href = "game.html";
  }

  function logout() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
