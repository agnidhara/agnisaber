<!DOCTYPE html>
<html>
<head>
  <title>Guess Game</title>
</head>

<body>

<h2>Guess The Number (1 - 10)</h2>

<input type="number" id="guessInput" placeholder="Enter guess">
<button onclick="checkGuess()">Guess</button>

<p id="message"></p>
<p id="coinsText">Coins: 0</p>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBJCPp0sAkNxgQ0PIXz9gSHIFXKpLmgD9Q",
  authDomain: "agnitech-3eee6.firebaseapp.com",
  databaseURL: "https://agnitech-3eee6-default-rtdb.firebaseio.com",
  projectId: "agnitech-3eee6",
  storageBucket: "agnitech-3eee6.appspot.com",
  messagingSenderId: "33138668117",
  appId: "1:33138668117:web:697bcfeb34615b482b5adc"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

/* ================= GAME VARIABLES ================= */

let coins = 0;
let randomNumber = Math.floor(Math.random() * 10) + 1;

const uid = localStorage.getItem("uid");

/* ================= LOAD USER DATA ================= */

function loadUserData(){

  if(!uid){
    alert("Please login first");
    window.location.href = "login.html";
    return;
  }

  database.ref("users/" + uid).once("value").then((snapshot)=>{

    if(snapshot.exists()){

      coins = snapshot.val().coins || 0;
      document.getElementById("coinsText").innerText = "Coins: " + coins;

    }else{

      database.ref("users/" + uid).set({
        coins: 0
      });

    }

  });

}

loadUserData();

/* ================= SAVE COINS ================= */

function saveCoins(){

  database.ref("users/" + uid).update({
    coins: coins
  });

}

/* ================= GUESS LOGIC ================= */

function checkGuess(){

  const guess = Number(document.getElementById("guessInput").value);
  const message = document.getElementById("message");

  if(guess === randomNumber){

    let reward = 50;
    coins += reward;

    message.innerText = "🎉 You won! +" + reward + " coins";

    saveCoins();

    document.getElementById("coinsText").innerText = "Coins: " + coins;

    randomNumber = Math.floor(Math.random() * 10) + 1;

  }
  else{

    message.innerText = "❌ Wrong guess. Try again!";

  }

}

</script>

</body>
</html>
