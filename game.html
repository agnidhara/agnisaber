<!DOCTYPE html>
<html>
<head>
  <title>Guess Game</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <h2>Guess the Number (1–100)</h2>

  <input id="g" type="number" placeholder="Enter number" />
  <button onclick="check()">Guess</button>

  <p id="msg"></p>
  <p>Balance: <span id="bal">100</span> coins</p>

  <!-- 🔽 ALL JS GOES HERE -->
  <script>
    // 🔹 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBJCPp0sAkNxgQ0PIXz9gSHIFXKpLmgD9Q",
      authDomain: "agnitech-3eee6.firebaseapp.com",
      projectId: "agnitech-3eee6",
      storageBucket: "agnitech-3eee6.appspot.com",
      messagingSenderId: "33138668117",
      appId: "1:33138668117:web:697bcfeb34615b482b5adc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔹 User setup
    const username =
      localStorage.getItem("username") ||
      prompt("Enter your username:");

    localStorage.setItem("username", username);

    let balance = Number(localStorage.getItem("balance")) || 100;
    let tries = 0;
    let number = Math.floor(Math.random() * 100) + 1;

    document.getElementById("bal").innerText = balance;

    // 🔹 Update leaderboard
    async function updateLeaderboard() {
      await db.collection("leaderboard").doc(username).set({
        username: username,
        coins: balance
      });
    }

    // 🔹 Game logic
    async function check() {
      let guess = Number(document.getElementById("g").value);
      let msg = document.getElementById("msg");

      if (!guess || guess < 1 || guess > 100) {
        msg.innerText = "Enter a number between 1 and 100!";
        return;
      }

      tries++;

      if (guess > number) msg.innerText = "Too high!";
      else if (guess < number) msg.innerText = "Too low!";
      else {
        let reward = 0;

        if (tries === 1) reward = 500;
        else if (tries <= 3) reward = 250;
        else if (tries <= 5) reward = 100;
        else reward = 50;

        balance += reward;
        localStorage.setItem("balance", balance);
        document.getElementById("bal").innerText = balance;

        await updateLeaderboard();

        msg.innerText = Correct! You earned ${reward} coins 🎉;

        // reset game
        tries = 0;
        number = Math.floor(Math.random() * 100) + 1;
      }
    }
  </script>

</body>
</html>
