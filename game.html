<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guess The Number</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.game-box{
  background:rgba(0,0,0,0.4);
  padding:30px;
  width:90%;
  max-width:450px;
  border-radius:15px;
  text-align:center;
}

button{
  padding:10px 18px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  background:#00c6ff;
}

input{
  padding:10px;
  width:80%;
  border:none;
  border-radius:8px;
}
</style>

</head>

<body>

<div class="game-box">

<div>
💰 Balance: <span id="balance">Loading...</span>
<button onclick="goBack()">Back</button>
</div>

<h1>🎯 Guess The Number</h1>
<p>Guess between 1 and 100</p>

<input type="number" id="guessInput">
<br>

<button onclick="checkGuess()">Guess</button>
<button onclick="restartGame()">Restart</button>

<p id="message"></p>
<p>Attempts: <span id="tries">0</span></p>

</div>

<script>

/* ================= Firebase ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBJCPp0sAkNxgQ0PIXz9gSHIFXKpLmgD9Q",
  authDomain: "agnitech-3eee6.firebaseapp.com",
  projectId: "agnitech-3eee6",
  storageBucket: "agnitech-3eee6.appspot.com",
  messagingSenderId: "33138668117",
  appId: "1:33138668117:web:697bcfeb34615b482b5adc"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= User ================= */

let uid = localStorage.getItem("uid");

if(!uid){
  alert("Please login first");
  window.location.href="login.html";
}

/* ================= Load Coins ================= */

let balance = 100;

db.collection("users").doc(uid).get().then(doc=>{
  if(doc.exists){
    balance = doc.data().balance || 100;
  }

  document.getElementById("balance").innerText = balance;
});

/* ================= Game Logic ================= */

let secretNumber = Math.floor(Math.random()*100)+1;
let tries = 0;

function checkGuess(){

  let guess = parseInt(document.getElementById("guessInput").value);
  let message = document.getElementById("message");

  if(!guess || guess<1 || guess>100){
    message.innerText="Enter number 1-100";
    return;
  }

  tries++;
  document.getElementById("tries").innerText = tries;

  if(guess < secretNumber){
    message.innerText="⬆️ Too Low";
  }
  else if(guess > secretNumber){
    message.innerText="⬇️ Too High";
  }
  else{

    let reward = 50;

    if(tries===1) reward=500;
    else if(tries<=3) reward=250;
    else if(tries<=5) reward=100;

    balance += reward;

    document.getElementById("balance").innerText = balance;

    message.innerText = "🎉 You Won! +" + reward + " coins";

    /* Save Coins to Firebase */
    db.collection("users").doc(uid).set({
      balance: balance
    }, {merge:true});

    /* Save Leaderboard */
    db.collection("leaderboard").doc(uid).set({
      balance: balance,
      tries: tries,
      time: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
}

/* ================= Restart ================= */

function restartGame(){
  secretNumber = Math.floor(Math.random()*100)+1;
  tries = 0;

  document.getElementById("tries").innerText = 0;
  document.getElementById("message").innerText = "";
  document.getElementById("guessInput").value = "";
}

/* ================= Back ================= */

function goBack(){
  window.location.href="dashboard.html";
}

</script>

</body>
</html>
