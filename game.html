<!DOCTYPE html>
<html>
<head>
<title>Guess Game</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#222;
  color:white;
  font-family:Arial;
}
.box{
  background:#000c;
  padding:30px;
  border-radius:20px;
  text-align:center;
}
input,button{
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}
button{background:#9acd32;}
</style>
</head>

<body>
<div class="box">
  <h2>Guess the Number (1–100)</h2>
  <input id="g" placeholder="Enter number">
  <button onclick="check()">Guess</button>
  <p id="msg"></p>
  <button onclick="back()">⬅ Back</button>
</div>

<script>
let num=Math.floor(Math.random()*100)+1;

function check(){
  let v=Number(g.value);
  if(v>num) msg.innerText="Too high!";
  else if(v<num) msg.innerText="Too low!";
  else msg.innerText="🎉 Correct!";
}

function back(){
  location.href="dashboard.html";
}
</script>
</body>
</html>
