<!DOCTYPE html>
<html>
<head>
  <title>Leaderboard</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 60%;
    }
    th, td {
      border: 1px solid #555;
      padding: 10px;
    }
    th {
      background: orange;
      color: black;
    }
  </style>
</head>
<body>

<h1>🔥 Leaderboard 🔥</h1>

<table>
  <thead>
    <tr>
      <th>Rank</th>
      <th>Name</th>
      <th>Coins</th>
    </tr>
  </thead>
  <tbody id="board"></tbody>
</table>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBJCPp0sAkNxgQ0PIXz9gSHIFXKpLmgD9Q",
    authDomain: "",
    projectId: "YOUR_PROJECT_ID",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const board = document.getElementById("board");

  db.collection("leaderboard")
    .orderBy("coins", "desc")
    .limit(10000)
    .onSnapshot(snapshot => {
      board.innerHTML = "";
      let rank = 1;
      snapshot.forEach(doc => {
        const data = doc.data();
        board.innerHTML += `
          <tr>
            <td>${rank}</td>
            <td>${data.name}</td>
            <td>${data.coins}</td>
          </tr>
        `;
        rank++;
      });
    });
</script>

</body>
</html>
