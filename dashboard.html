<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #1f4037, #99f2c8);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.card {
  width: 420px;
  padding: 30px;
  background: rgba(0,0,0,0.75);
  color: white;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
}

h1 {
  margin-bottom: 15px;
}

img {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #9acd32;
  margin-bottom: 10px;
}

.balance {
  margin: 15px 0;
  font-size: 22px;
  font-weight: bold;
  color: gold;
}

input[type="file"] {
  margin-bottom: 20px;
  color: white;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}

.play {
  background: #9acd32;
  color: black;
}

.logout {
  background: #ff7b2c;
  color: white;
}
</style>
</head>

<body>

<div class="card">
  <h1>Welcome 👋</h1>

  <img id="profilePic" src="" alt="Profile Picture">

  <input type="file" accept="image/*" onchange="savePic(event)">

  <!-- 💰 BALANCE AREA (REPLACED "MORE COMING SOON") -->
  <div class="balance">
    💰 Balance: <span id="balance">0</span> coins
  </div>

  <button class="play" onclick="playGame()">▶ Play Guess the Number</button>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
// LOAD / SET BALANCE
let balance = localStorage.getItem("balance");
if (balance === null) {
  balance = 100;
  localStorage.setItem("balance", balance);
}
document.getElementById("balance").innerText = balance;

// LOAD PROFILE PIC
const img = document.getElementById("profilePic");
const savedPic = localStorage.getItem("profilePic");
img.src = savedPic ? savedPic : "https://via.placeholder.com/140";

// SAVE PROFILE PIC
function savePic(event) {
  const file = event.target.files[0];
  const reader = new FileReader();
  reader.onload = function () {
    localStorage.setItem("profilePic", reader.result);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// NAVIGATION
function playGame() {
  window.location.href = "game.html";
}

function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "index.html";
}
</script>

</body>
</html>
