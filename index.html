<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #4e7c6e, #7fbfa3);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FULL SCREEN CONTAINER */
.dashboard {
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* MAIN CARD */
.card {
  width: 90%;
  max-width: 500px;
  padding: 35px;
  background: rgba(0,0,0,0.75);
  border-radius: 25px;
  text-align: center;
  color: white;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
}

/* PROFILE IMAGE */
.profile-pic {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #7CFF4F;
  margin-bottom: 10px;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

.play-btn {
  background: #7CFF4F;
  color: black;
}

.logout-btn {
  background: #ff6b35;
  color: white;
}

button:hover {
  opacity: 0.9;
}

input[type="file"] {
  margin: 10px 0;
  color: white;
}

.more {
  margin-top: 18px;
  color: #ffd966;
}
</style>
</head>

<body>

<div class="dashboard">
  <div class="card">
    <h2>Welcome, Player 👋</h2>

    <img id="preview" class="profile-pic" src="" alt="Profile Picture">

    <input type="file" accept="image/*" onchange="loadPic(event)">

    <button class="play-btn" onclick="playGame()">▶ Play Guess the Number</button>

    <div class="more">✨ More coming soon...</div>

    <button class="logout-btn" onclick="logout()">Logout ⎋</button>
  </div>
</div>

<script>
function loadPic(event) {
  const img = document.getElementById("preview");
  img.src = URL.createObjectURL(event.target.files[0]);
}

function playGame() {
  alert("Game will start here 🎮");
}

function logout() {
  alert("Logged out!");
}
</script>

</body>
</html>
