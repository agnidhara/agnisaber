<!DOCTYPE html>
<script>
  // User setup
  const username = localStorage.getItem("username") || prompt("Enter your username:");
  localStorage.setItem("username", username);

  let balance = Number(localStorage.getItem("balance")) || 100;
  let tries = 0;
  let number = Math.floor(Math.random() * 100) + 1;

  // Update leaderboard
  async function updateLeaderboard() {
    try {
      await db.collection("leaderboard").doc(username).set({
        username: username,
        coins: balance
      });
    } catch(err) { console.error(err); }
  }

  async function check() {
    let guess = Number(document.getElementById("g").value);
    let msg = document.getElementById("msg");

    if (!guess || guess < 1 || guess > 100) {
      msg.innerText = "Enter a number between 1 and 100!";
      return;
    }

    tries++;

    if (guess > number) msg.innerText = "⬆ Too high!";
    else if (guess < number) msg.innerText = "⬇ Too low!";
    else {
      let reward = 0;
      if (tries === 1) reward = 500;
      else if (tries <=3) reward = 250;
      else if (tries <=5) reward = 100;
      else reward = 50;

      balance += reward;
      localStorage.setItem("balance", balance);
      await updateLeaderboard();

      msg.innerText = `🏆 You won! ${reward} coins`;
      setTimeout(() => {
        alert(`🎉 You won!\nTries: ${tries}\nCoins earned: ${reward}\nTotal balance: ${balance}`);
        window.location.href = "dashboard.html";
      }, 800);
    }
  }

  function back() {
    window.location.href = "dashboard.html";
  }
</script>
