<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1f4037, #99f2c8);
        font-family: Arial, sans-serif;
    }

    .dashboard {
        width: 420px;
        padding: 30px;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    h1 {
        margin-bottom: 20px;
    }

    .profile-pic {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 4px solid #4caf50;
        object-fit: cover;
        margin-bottom: 10px;
    }

    input[type="file"] {
        margin: 12px 0;
        color: white;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .play-btn {
        background: #4caf50;
        color: white;
    }

    .play-btn:hover {
        background: #43a047;
    }

    .logout-btn {
        background: #ff5722;
        color: white;
    }

    .logout-btn:hover {
        background: #e64a19;
    }

    .coming-soon {
        margin-top: 18px;
        opacity: 0.85;
        font-style: italic;
    }
</style>
</head>

<body>

<div class="dashboard">
    <h1>Welcome, <span id="username">Player</span> 👋</h1>

    <img src="" id="profilePic" class="profile-pic" alt="Profile Picture">

    <input type="file" accept="image/*" onchange="uploadPic(event)">

    <button class="play-btn" onclick="playGame()">▶ Play Guess the Number</button>

    <div class="coming-soon">✨ More coming soon...</div>

    <button class="logout-btn" onclick="logout()">Logout 🚪</button>
</div>

<script>
    // SET USERNAME (change this later from login system)
    let currentUser = localStorage.getItem("loggedUser") || "Player";
    document.getElementById("username").innerText = currentUser;

    // LOAD PROFILE PIC
    let savedPic = localStorage.getItem("profilePic_" + currentUser);
    if (savedPic) {
        document.getElementById("profilePic").src = savedPic;
    } else {
        document.getElementById("profilePic").src = "https://via.placeholder.com/130";
    }

    function uploadPic(event) {
        let file = event.target.files[0];
        let reader = new FileReader();

        reader.onload = function () {
            document.getElementById("profilePic").src = reader.result;
            localStorage.setItem("profilePic_" + currentUser, reader.result);
        };
        reader.readAsDataURL(file);
    }

    function playGame() {
        alert("Guess the Number game coming next 🎮");
        // later: window.location.href = "game.html";
    }

    function logout() {
        localStorage.removeItem("loggedUser");
        alert("Logged out!");
        location.reload();
    }
</script>

</body>
</html>
