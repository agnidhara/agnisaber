<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess The Number</title>

  <!-- CSS -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .box {
      background: rgba(0,0,0,0.75);
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      text-align: center;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff9800;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #ffc107;
    }

    .blue {
      background: #00e5ff;
    }

    #msg {
      margin-top: 15px;
      min-height: 22px;
      font-weight: bold;
    }

    .balance {
      margin-top: 15px;
      font-size: 18px;
      color: #00e5ff;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <div class="box">
    <h2>🎯 Guess the Number</h2>
    <p>(Between 1 and 100)</p>

    <input id="guessInput" type="number" placeholder="Enter number">

    <br>
    <button onclick="checkGuess()">Guess</button>
    <button onclick="restartGame()">Restart</button>

    <p id="msg"></p>

    <div class="balance">
      Balance: <span id="bal">100</span> 🪙
    </div>

    <br>
    <button class="blue" onclick="goBack()">⬅ Back</button>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBJCPp0sAkNxgQ0PIXz9gSHIFXKpLmgD9Q",
      authDomain: "agnitech-3eee6.firebaseapp.com",
      projectId: "agnitech-3eee6",
      storageBucket: "agnitech-3eee6.appspot.com",
      messagingSenderId: "33138668117",
      appId: "1:33138668117:web:697bcfeb34615b482b5adc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // User
    let username = localStorage.getItem("username");
    if (!username) {
      username = prompt("Enter username:");
      localStorage.setItem("username", username);
    }

    // Game variables
    let number = Math.floor(Math.random() * 100) + 1;
    let tries = 0;
    let balance = Number(localStorage.getItem("balance")) || 100;

    document.getElementById("bal").innerText = balance;

    async function updateLeaderboard() {
      await db.collection("leaderboard").doc(username).set({
        username: username,
        coins: balance
      });
    }

    function checkGuess() {
      const input = document.getElementById("guessInput");
      const msg = document.getElementById("msg");
      const guess = Number(input.value);

      if (input.value === "") {
        msg.innerText = "❌ Enter a number first!";
        return;
      }

      if (guess < 1 || guess > 100) {
        msg.innerText = "⚠️ Only 1–100 allowed!";
        return;
      }

      tries++;

      if (guess > number) {
        msg.innerText = "📈 Too HIGH!";
      } 
      else if (guess < number) {
        msg.innerText = "📉 Too LOW!";
      } 
      else {
        let reward = 100;
        if (tries === 1) reward = 500;
        else if (tries <= 3) reward = 250;

        balance += reward;
        localStorage.setItem("balance", balance);
        document.getElementById("bal").innerText = balance;

        updateLeaderboard();

        msg.innerText = 🎉 CORRECT! +${reward} coins;
        input.disabled = true;
      }

      input.value = "";
    }

    function restartGame() {
      number = Math.floor(Math.random() * 100) + 1;
      tries = 0;
      document.getElementById("msg").innerText = "🔄 Game restarted!";
      document.getElementById("guessInput").disabled = false;
      document.getElementById("guessInput").value = "";
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
