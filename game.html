<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess The Number</title>

  <!-- 🎨 CSS (SKIN) -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-box {
      background: rgba(0, 0, 0, 0.65);
      padding: 30px;
      border-radius: 14px;
      width: 360px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      background: #ff9800;
      color: black;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #ffc107;
    }

    #msg {
      margin-top: 15px;
      font-weight: bold;
      min-height: 20px;
    }

    .balance {
      margin-top: 15px;
      font-size: 18px;
      color: #00e5ff;
    }
  </style>

  <!-- 🔥 Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <!-- 🎮 GAME UI -->
  <div class="game-box">
    <h2>🎯 Guess the Number</h2>

    <input id="g" type="number" placeholder="Enter 1 - 100">
    <br>

    <button onclick="check()">Guess</button>

    <p id="msg"></p>

    <div class="balance">
      Balance: <span id="bal">100</span> 🪙
    </div>
  </div>

  <!-- 🧠 GAME + FIREBASE LOGIC -->
  <script>
    // 🔹 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBJCPp0sAkNxgQ0PIXz9gSHIFXKpLmgD9Q",
      authDomain: "agnitech-3eee6.firebaseapp.com",
      projectId: "agnitech-3eee6",
      storageBucket: "agnitech-3eee6.appspot.com",
      messagingSenderId: "33138668117",
      appId: "1:33138668117:web:697bcfeb34615b482b5adc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔹 User
    let username = localStorage.getItem("username");
    if (!username) {
      username = prompt("Enter your username:");
      localStorage.setItem("username", username);
    }

    // 🔹 Game data
    let balance = Number(localStorage.getItem("balance")) || 100;
    let tries = 0;
    let number = Math.floor(Math.random() * 100) + 1;

    document.getElementById("bal").innerText = balance;

    // 🔹 Save to leaderboard
    async function updateLeaderboard() {
      await db.collection("leaderboard").doc(username).set({
        username: username,
        coins: balance
      });
    }

    // 🔹 Game logic
    async function check() {
      const guess = Number(document.getElementById("g").value);
      const msg = document.getElementById("msg");

      if (!guess || guess < 1 || guess > 100) {
        msg.innerText = "⚠️ Enter a number between 1 and 100!";
        return;
      }

      tries++;

      if (guess > number) {
        msg.innerText = "📈 Too high!";
      } else if (guess < number) {
        msg.innerText = "📉 Too low!";
      } else {
        let reward = 50;

        if (tries === 1) reward = 500;
        else if (tries <= 3) reward = 250;
        else if (tries <= 5) reward = 100;

        balance += reward;
        localStorage.setItem("balance", balance);
        document.getElementById("bal").innerText = balance;

        await updateLeaderboard();

        msg.innerText = 🎉 Correct! You earned ${reward} coins;

        // Reset game
        tries = 0;
        number = Math.floor(Math.random() * 100) + 1;
        document.getElementById("g").value = "";
      }
    }
  </script>

</body>
</html>
