<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess The Number</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-box {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      width: 90%;
      max-width: 450px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      width: 80%;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 18px;
      margin: 6px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #00c6ff;
      color: black;
      font-weight: bold;
    }

    button:hover {
      background: #00a2d4;
    }

    .info {
      margin-top: 10px;
      font-size: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="game-box">
    <div class="top-bar">
      <div>💰 Balance: <span id="balance">100</span></div>
      <button onclick="goBack()">BACK TO DASHBOARD</button>
    </div>

    <h1>Guess The Number</h1>
    <p>Guess a number between <b>1 and 100</b></p>

    <input type="number" id="guessInput" placeholder="Enter number" />
    <br>

    <button onclick="checkGuess()">Guess</button>
    <button onclick="restartGame()">Restart</button>

    <div class="info" id="message"></div>
    <div class="info">Attempts: <span id="tries">0</span></div>
  </div>

  <!-- SCRIPT: ALWAYS AT THE BOTTOM -->
  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBJCPp0sAkNxgQ0PIXz9gSHIFXKpLmgD9Q",
      authDomain: "agnitech-3eee6.firebaseapp.com",
      projectId: "agnitech-3eee6",
      storageBucket: "agnitech-3eee6.appspot.com",
      messagingSenderId: "33138668117",
      appId: "1:33138668117:web:697bcfeb34615b482b5adc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Game variables
    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let tries = 0;
    let username = localStorage.getItem("username") || "Guest";
    let balance = parseInt(localStorage.getItem("balance")) || 100;

    document.getElementById("balance").innerText = balance;

    function checkGuess() {
      const guess = parseInt(document.getElementById("guessInput").value);
      const message = document.getElementById("message");

      if (!guess || guess < 1 || guess > 100) {
        message.innerText = "Enter a number between 1 and 100";
        return;
      }

      tries++;
      document.getElementById("tries").innerText = tries;

      if (guess < secretNumber) {
        message.innerText = "Too low!";
      } else if (guess > secretNumber) {
        message.innerText = "Too high!";
      } else {
        // Calculate reward
        let reward = 50;
        if (tries === 1) reward = 500;
        else if (tries <= 3) reward = 250;
        else if (tries <= 5) reward = 100;

        balance += reward;
        localStorage.setItem("balance", balance);
        document.getElementById("balance").innerText = balance;

        message.innerText = "You won! +" + reward + " coins";

        // Save to leaderboard
        saveToLeaderboard();
      }
    }

    function restartGame() {
      secretNumber = Math.floor(Math.random() * 100) + 1;
      tries = 0;
      document.getElementById("tries").innerText = 0;
      document.getElementById("message").innerText = "";
      document.getElementById("guessInput").value = "";
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }

    function saveToLeaderboard() {
      db.collection("leaderboard").doc(username).set({
        username: username,
        balance: balance,
        tries: tries,
        time: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  </script>

</body>
</html>
