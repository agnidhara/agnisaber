<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#1f4037;
  font-family:Arial;
}
.box{
  background:#000c;
  padding:30px;
  border-radius:20px;
  color:white;
  width:320px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
}
button{
  background:#9acd32;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="box">
  <h2>Login / Signup</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>

  <p id="msg"></p>
</div>

<script>
function signup(){
  let u=user.value;
  let p=pass.value;
  if(localStorage[u]){
    msg.innerText="Username already exists!";
  } else {
    localStorage[u]=p;
    msg.innerText="Signup successful!";
  }
}

function login(){
  let u=user.value;
  let p=pass.value;
  if(localStorage[u]===p){
    localStorage.currentUser=u;
    location.href="dashboard.html";
  } else {
    msg.innerText="Wrong username or password";
  }
}
</script>
</body>
</html>
